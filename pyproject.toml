[project]
name = "btbatterylab"
version = "0.1.0"
description = "Bluetooth battery monitoring and analytics platform for Windows"
authors = [
    { name = "Patrick Bernardoni" }
]
requires-python = ">=3.11"
dependencies = [
    # v0.2's UI (see docs/roadmap.md, "UI Technology Decision: NiceGUI")
    # - the project's first third-party runtime dependency; everything
    # before this was standard-library only.
    "nicegui>=2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]