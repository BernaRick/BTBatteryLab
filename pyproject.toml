[project]
name = "btbatterylab"
version = "0.1.0"
description = "Bluetooth battery monitoring and analytics platform for Windows"
authors = [
    { name = "Patrick Bernardoni" }
]
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]